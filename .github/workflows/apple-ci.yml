name: Apple CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-packages:
    name: Swift Package (WhyTeaYouTube)
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Xcode 27 and Swift 6.4
        shell: bash
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version)"
          swift_version="$(xcrun swift --version)"
          printf '%s\n' "${xcode_version}" "${swift_version}"
          grep -Eq '^Xcode 27([.]|$)' <<< "${xcode_version}"
          grep -Eq 'Apple Swift version 6[.]4([. ]|$)' <<< "${swift_version}"

      - name: Run package tests
        working-directory: Packages/WhyTeaYouTube
        run: swift test

  app-build:
    name: App Build
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Xcode 27 and Swift 6.4
        shell: bash
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version)"
          swift_version="$(xcrun swift --version)"
          printf '%s\n' "${xcode_version}" "${swift_version}"
          grep -Eq '^Xcode 27([.]|$)' <<< "${xcode_version}"
          grep -Eq 'Apple Swift version 6[.]4([. ]|$)' <<< "${swift_version}"

      - name: Select an iOS 27 simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(
            xcrun simctl list devices available --json | python3 -c '
          import json
          import re
          import sys

          payload = json.load(sys.stdin)
          candidates = []
          for runtime_identifier, devices in payload["devices"].items():
              match = re.search(r"iOS-(27(?:-\d+)*)$", runtime_identifier)
              if match is None:
                  continue
              version = tuple(int(component) for component in match.group(1).split("-"))
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))

          if not candidates:
              print("No available iPhone simulator with an iOS 27 runtime was found.", file=sys.stderr)
              sys.exit(1)

          candidates.sort(reverse=True)
          print(candidates[0][2])
          '
          )"
          echo "Selected iOS 27 simulator: ${simulator_udid}"
          echo "udid=${simulator_udid}" >> "${GITHUB_OUTPUT}"

      - name: Build the app for the simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild \
            -project WhyTea.xcodeproj \
            -scheme WhyTea \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath artifacts/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee artifacts/app-build.log

      - name: Upload app-build failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-build-failure-${{ github.run_attempt }}
          path: artifacts/app-build.log
          if-no-files-found: warn
          retention-days: 7

  apple-ci:
    name: Apple CI
    if: always()
    needs:
      - swift-packages
      - app-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every Apple lane to pass
        shell: bash
        run: |
          if [[ "${{ needs.swift-packages.result }}" != "success" ||
                "${{ needs.app-build.result }}" != "success" ]]; then
            echo "One or more Apple CI lanes did not pass."
            exit 1
          fi
          echo "All Apple CI lanes passed."
